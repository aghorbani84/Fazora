name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Build release
        run: cargo build --release --features desktop

      - name: Create portable archive
        run: |
          mkdir -p fazora-linux-x86_64
          cp target/release/fazora fazora-linux-x86_64/
          cp README.md fazora-linux-x86_64/
          cp LICENSE fazora-linux-x86_64/ 2>/dev/null || true
          tar -czf fazora-linux-x86_64.tar.gz -C fazora-linux-x86_64 .

      - name: Generate SHA-256 checksum
        run: sha256sum fazora-linux-x86_64.tar.gz > fazora-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fazora-linux-x86_64
          path: |
            fazora-linux-x86_64.tar.gz
            fazora-linux-x86_64.tar.gz.sha256
