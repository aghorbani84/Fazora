name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Create portable archive
        run: |
          mkdir -p fazora-linux-x86_64
          cp target/release/fazora fazora-linux-x86_64/
          cp README.md fazora-linux-x86_64/
          cp LICENSE fazora-linux-x86_64/ 2>/dev/null || true
          tar -czf fazora-linux-x86_64.tar.gz -C fazora-linux-x86_64 .

      - name: Generate SHA-256 checksum
        run: sha256sum fazora-linux-x86_64.tar.gz > fazora-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazora-linux-x86_64
          path: |
            fazora-linux-x86_64.tar.gz
            fazora-linux-x86_64.tar.gz.sha256
