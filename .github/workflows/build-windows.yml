name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        include:
          - arch: x86_64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Create portable ZIP package
        run: |
          mkdir -p fazora-windows-${{ matrix.arch }}
          cp target/${{ matrix.rust_target }}/release/fazora.exe fazora-windows-${{ matrix.arch }}/
          cp README.md fazora-windows-${{ matrix.arch }}/
          cp LICENSE fazora-windows-${{ matrix.arch }}/ 2>$null || true
          Compress-Archive -Path fazora-windows-${{ matrix.arch }}/* -DestinationPath fazora-windows-${{ matrix.arch }}.zip

      - name: Generate SHA-256 checksum
        run: Get-FileHash -Algorithm SHA256 fazora-windows-${{ matrix.arch }}.zip | Format-List -Property Hash | ForEach-Object { $_.Hash } | Out-File -FilePath fazora-windows-${{ matrix.arch }}.zip.sha256 -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fazora-windows-${{ matrix.arch }}
          path: |
            fazora-windows-${{ matrix.arch }}.zip
            fazora-windows-${{ matrix.arch }}.zip.sha256
