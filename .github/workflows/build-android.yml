name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Android NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install pinned Dioxus CLI
        run: |
          DX_ARCHIVE="$RUNNER_TEMP/dx.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$DX_ARCHIVE"
          echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  $DX_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dx"
          tar -xzf "$DX_ARCHIVE" -C "$RUNNER_TEMP/dx"
          DX_BIN="$(find "$RUNNER_TEMP/dx" -type f -name dx -perm -u+x -print -quit)"
          test -n "$DX_BIN"
          sudo install -m 0755 "$DX_BIN" /usr/local/bin/dx
          dx --version

      - name: Verify Android toolchain
        run: |
          rustc --version
          cargo --version
          dx --version
          java -version
          test -n "$ANDROID_HOME"
          test -n "$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

      - name: Bundle installable APK
        env:
          RUST_BACKTRACE: "1"
        run: |
          dx bundle --android --release --package-types apk --target ${{ matrix.rust_target }} --verbose
          APK_PATH="$(find target -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" || { echo "Dioxus did not produce an APK"; exit 1; }
          mkdir -p dist
          cp "$APK_PATH" "dist/FAZORA-${{ matrix.abi }}-unsigned.apk"

      - name: Sign APK for direct installation
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fazora-ci.keystore" \
            -storepass android -keypass android -alias fazora-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FAZORA CI,O=FAZORA,C=US"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/fazora-ci.keystore" \
            --ks-key-alias fazora-ci \
            --ks-pass pass:android --key-pass pass:android \
            --out "dist/FAZORA-${{ matrix.abi }}.apk" \
            "dist/FAZORA-${{ matrix.abi }}-unsigned.apk"
          "$APKSIGNER" verify --verbose "dist/FAZORA-${{ matrix.abi }}.apk"
          sha256sum "dist/FAZORA-${{ matrix.abi }}.apk" > "dist/FAZORA-${{ matrix.abi }}.apk.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FAZORA-Android-${{ matrix.abi }}
          path: |
            dist/FAZORA-${{ matrix.abi }}.apk
            dist/FAZORA-${{ matrix.abi }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
