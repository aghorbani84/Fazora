name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            ndk_abi: arm64-v8a
          - abi: x86_64
            rust_target: x86_64-linux-android
            ndk_abi: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install Android SDK/NDK and Java
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r26b
          api-level: 24

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.rust_target }}

      - name: Add Android targets
        run: |
          rustup target add ${{ matrix.rust_target }}

      - name: Build Android release
        run: |
          cargo build --release --target ${{ matrix.rust_target }}

      - name: Package native library
        run: |
          echo "Android APK packaging requires Dioxus mobile toolchain configuration."
          echo "Native library built at: target/${{ matrix.rust_target }}/release/libfazora.so"
          mkdir -p fazora-android-${{ matrix.abi }}
          cp target/${{ matrix.rust_target }}/release/libfazora.so fazora-android-${{ matrix.abi }}/ 2>/dev/null || true
          cp README.md fazora-android-${{ matrix.abi }}/

      - name: Generate SHA-256 checksum
        run: sha256sum fazora-android-${{ matrix.abi }}/libfazora.so > fazora-android-${{ matrix.abi }}.sha256 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fazora-android-${{ matrix.abi }}
          path: fazora-android-${{ matrix.abi }}/
