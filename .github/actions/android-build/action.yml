name: Build and smoke-test Android APKs
description: Build debug-signed ARM64 and x86_64 APKs, verify checksums and 16KiB alignment, then smoke-test on an x86_64 emulator.
runs:
  using: composite
  steps:
    - name: Install Android SDK command-line tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools

    - name: Install pinned Android SDK platform and build tools
      shell: bash
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

    - name: Install pinned Android NDK
      id: ndk
      uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
      with:
        ndk-version: r28c
        link-to-sdk: true

    - name: Export NDK environment
      shell: bash
      env:
        NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
        echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

    - name: Set up JDK 17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Rust Android targets
      shell: bash
      run: rustup target add aarch64-linux-android x86_64-linux-android

    - name: Download and verify Dioxus CLI 0.7.10
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/dx-0.7.10.tar.gz"
        curl --fail --location --retry 3 "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz" --output "$archive"
        echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/dx"
        tar -xzf "$archive" -C "$RUNNER_TEMP/dx"
        dx_bin="$(find "$RUNNER_TEMP/dx" -type f -name dx -perm -u+x -print -quit)"
        test -n "$dx_bin"
        sudo install -m 0755 "$dx_bin" /usr/local/bin/dx
        dx --version

    - name: Build, align, debug-sign and verify both APKs
      shell: bash
      env:
        RUST_BACKTRACE: "1"
      run: |
        set -euo pipefail
        mkdir -p dist
        key="$RUNNER_TEMP/fazora-ci-debug.keystore"
        keytool -genkeypair -v -keystore "$key" -storepass android -keypass android -alias fazora-ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FAZORA CI,O=FAZORA,C=US"
        aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
        zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
        apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        llvm_objdump="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
        test -x "$aapt" && test -x "$zipalign" && test -x "$apksigner" && test -x "$llvm_objdump"
        for spec in "arm64-v8a:aarch64-linux-android" "x86_64:x86_64-linux-android"; do
          abi="${spec%%:*}"
          target="${spec#*:}"
          out="dist/$abi"
          mkdir -p "$out"
          started="$(date +%s)"
          dx bundle --android --release --package-types apk --target "$target" --out-dir "$out" --cargo-args=--locked --verbose
          finished="$(date +%s)"
          apk_path="$(find "$out" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "Dioxus did not produce an APK for $abi"; exit 1; }
          actual="$("$aapt" dump badging "$apk_path" | awk -F"'" '/^package: name=/{print $2; exit}')"
          test "$actual" = "com.fazora.media" || { echo "Expected com.fazora.media, got $actual"; exit 1; }
          unsigned="$out/FAZORA-$abi-unsigned.apk"
          aligned="$out/FAZORA-$abi-aligned.apk"
          signed="$out/FAZORA-$abi.apk"
          mv "$apk_path" "$unsigned"
          "$zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$apksigner" sign --ks "$key" --ks-key-alias fazora-ci --ks-pass pass:android --key-pass pass:android --out "$signed" "$aligned"
          "$apksigner" verify --verbose --print-certs "$signed"
          "$zipalign" -c -P 16 -v 4 "$signed"
          extracted="$RUNNER_TEMP/fazora-apk-$abi"
          mkdir -p "$extracted"
          unzip -q "$signed" -d "$extracted"
          so_files="$(find "$extracted/lib" -type f -name '*.so' -print)"
          test -n "$so_files" || { echo "No native shared libraries found in $abi APK"; exit 1; }
          while IFS= read -r so_file; do
            alignments="$("$llvm_objdump" -p "$so_file" | awk '$1 == "LOAD" { print $NF }')"
            test -n "$alignments" || { echo "No ELF LOAD segments found in $so_file"; exit 1; }
            bad="$(echo "$alignments" | awk '$0 !~ /^2[*][*](1[4-9]|[2-9][0-9])$/')"
            if [ -n "$bad" ]; then
              echo "ELF LOAD segment(s) below 16KiB alignment in $so_file:"
              echo "$bad"
              exit 1
            fi
          done <<< "$so_files"
          cp "$signed" "dist/FAZORA-$abi.apk"
          (cd dist && sha256sum "FAZORA-$abi.apk" > "FAZORA-$abi.apk.sha256")
          bytes="$(stat -c '%s' "$signed")"
          metadata="dist/FAZORA-$abi-build-metadata.txt"
          printf 'abi=%s\napplication_id=com.fazora.media\nrust_target=%s\napk_size_bytes=%s\nbundle_seconds=%s\n' "$abi" "$target" "$bytes" "$((finished-started))" > "$metadata"
          echo "android_sdk=35" >> "$metadata"
          echo "android_build_tools=35.0.0" >> "$metadata"
          echo "android_ndk=r28c" >> "$metadata"
          java -version 2>&1 | sed -n '1p' >> "$metadata"
          rustc --version >> "$metadata"
          dx --version >> "$metadata"
          echo "apk_zip_alignment=16KiB_verified" >> "$metadata"
          echo "elf_load_alignment=16KiB_verified" >> "$metadata"
          du -h "$signed" | tee -a "$metadata"
        done

    - name: Upload ARM64 APK and checksum
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: FAZORA-Android-arm64-v8a
        path: |
          dist/FAZORA-arm64-v8a.apk
          dist/FAZORA-arm64-v8a.apk.sha256
          dist/FAZORA-arm64-v8a-build-metadata.txt
        if-no-files-found: error
        retention-days: 30

    - name: Upload x86_64 APK and checksum
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: FAZORA-Android-x86_64
        path: |
          dist/FAZORA-x86_64.apk
          dist/FAZORA-x86_64.apk.sha256
          dist/FAZORA-x86_64-build-metadata.txt
        if-no-files-found: error
        retention-days: 30

    - name: Create emulator evidence directory
      shell: bash
      run: mkdir -p smoke-evidence/screenshots

    - name: Detect KVM and enable access when available
      id: kvm
      shell: bash
      run: |
        set -euo pipefail
        if [ -e /dev/kvm ]; then
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          if sudo kvm-ok; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM is available; hardware-accelerated emulator selected."
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            exit 0
          fi
        fi
        echo "available=false" >> "$GITHUB_OUTPUT"
        echo "::warning::KVM is not available; attempting software emulation. A larger GitHub runner or self-hosted Linux runner with KVM is the faster fallback if the emulator times out."

    - name: Install, launch and inspect on 16KiB x86_64 emulator
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 35
        target: google_apis_ps16k
        arch: x86_64
        emulator-boot-timeout: 1200
        disable-linux-hw-accel: ${{ steps.kvm.outputs.available != 'true' }}
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        disable-animations: true
        script: |
          set -euo pipefail
          app_id="com.fazora.media"
          apk="dist/FAZORA-x86_64.apk"
          test -s "$apk"
          adb wait-for-device
          adb shell getprop sys.boot_completed | grep -q 1
          page_size="$(adb shell getconf PAGE_SIZE | tr -d "\r")"
          test "$page_size" = "16384" || { echo "Expected 16KiB page size, got $page_size"; exit 1; }
          adb install -r "$apk"
          adb logcat -c
          adb shell monkey -p "$app_id" -c android.intent.category.LAUNCHER 1
          sleep 60
          adb exec-out screencap -p > smoke-evidence/screenshots/after-60-seconds.png
          adb logcat -d -v threadtime > smoke-evidence/logcat.txt
          adb shell getconf PAGE_SIZE > smoke-evidence/page-size.txt
          adb shell dumpsys package "$app_id" > smoke-evidence/package.txt
          adb shell pidof "$app_id" > smoke-evidence/process.txt
          test -s smoke-evidence/process.txt
          if grep -E 'FATAL EXCEPTION|panicked at' smoke-evidence/logcat.txt; then
            echo "Crash signature found in logcat"
            exit 1
          fi
          printf 'PASS: installed, launched, process alive after 60 seconds, no crash signatures found.\n' > smoke-evidence/result.txt

    - name: Upload emulator logs and screenshot
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: FAZORA-Android-emulator-smoke
        path: smoke-evidence/
        if-no-files-found: warn
        retention-days: 30
