[package]
name = "fazora"
version = "0.1.0"
edition = "2021"
description = "FAZORA Media — premium multimedia player. Sound. Motion. Precision."
authors = ["FAZORA"]
rust-version = "1.83"
build = "build.rs"

[[bin]]
name = "fazora"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-desktop = { version = "0.7.10", optional = true }
manganis = "0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:dioxus-desktop"]
mobile = ["dioxus/mobile"]

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3"

[workspace]
