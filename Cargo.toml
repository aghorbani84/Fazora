[package]
name = "fazora"
version = "0.1.0"
edition = "2021"
description = "FAZORA Media — premium multimedia player. Sound. Motion. Precision."
authors = ["FAZORA"]
rust-version = "1.78"

[[bin]]
name = "fazora"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.5", features = ["tracing", "hot-reload"] }
dioxus-desktop = { version = "0.5", features = ["tracing"] }
dioxus-router = { version = "0.5" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
