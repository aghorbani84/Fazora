# FAZORA dependency policy.
# Vulnerability and unsound advisories remain errors.
[advisories]
unmaintained = "workspace"
unsound = "all"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# MPL-2.0 is allowed only for these exact transitive packages/versions.
# Keep their upstream notices and source/license texts available in distributions.
[[licenses.exceptions]]
name = "cssparser"
version = "0.29.6"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "0.6.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "0.24.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
